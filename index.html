<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alfred</title>
  <meta name="description" content="Offline-first facility management for Alfred Coffee California locations.">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alfred">
  <meta name="application-name" content="Alfred">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" data-action="menu" aria-label="Menu">☰</button>
    <a class="brand" href="#/"><span class="logo">A</span><span><b>alfred</b></span></a>
    <form id="global-search" class="global-search" role="search">
      <input type="search" name="q" placeholder="Search serial #, vendor, WO #…" aria-label="Search">
    </form>
    <span id="net-status" class="net on">Online</span>
  </header>

  <div class="layout">
    <nav id="nav" class="sidebar">
      <a href="#/" data-route="dashboard">📊 Dashboard</a>
      <a href="#/locations" data-route="locations">🏪 Locations</a>
      <a href="#/wo" data-route="wo">🧾 Work orders</a>
      <a href="#/pm" data-route="pm">🗓️ Preventive maint.</a>
      <a href="#/visits" data-route="visits">📋 Site visits</a>
      <a href="#/vendors" data-route="vendors">📇 Team & vendors</a>
      <a href="#/reports" data-route="reports">📈 Reports</a>
      <a href="#/docs" data-route="docs">📐 Plans & docs</a>
      <a href="#/search/" data-route="search">🔎 Search</a>
      <a id="resq-link" href="#" target="_blank" rel="noopener" hidden>🔗 Open ResQ ↗</a>
      <a href="#/settings" data-route="settings">⚙️ Settings & backup</a>
    </nav>
    <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
